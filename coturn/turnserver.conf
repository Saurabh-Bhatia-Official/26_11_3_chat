# ==============================================================================
# Coturn STUN/TURN Server Configuration for Whisper Chat
# ==============================================================================
# Self-hosted STUN/TURN relay server for WebRTC audio/video calls.
# Supports secure, expiring ephemeral credentials via the TURN REST API standard.
# ==============================================================================

# Network listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IPs (0.0.0.0 binds to all available IPv4 interfaces)
listening-ip=0.0.0.0

# Relay IP (Uncomment and set to your server's public IPv4 if behind NAT / AWS / GCP)
# external-ip=YOUR_PUBLIC_IP_HERE

# UDP Relay port range for peer media packets (RTP/RTCP)
min-port=49152
max-port=65535

# Realm for authentication (matches the whisper domain/organization)
realm=whisper.chat

# Server identity
server-name=whisper-turn

# Enable long-term credential mechanism & HMAC-SHA1 shared secret authentication
lt-cred-mech
use-auth-secret
static-auth-secret=whisper_turn_secret_secure_key_2026

# Fingerprint in TURN messages (RFC 5389 requirement)
fingerprint

# Mobility with ICE
mobility

# Disable insecure plaintext CLI
no-cli

# Security: Block relaying loopback and local private networks to prevent SSRF
no-loopback-peers
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Performance and resource limits
total-quota=100
max-bps=3000000
bps-capacity=0
stale-nonce=600

# Logging
verbose
log-file=stdout
no-stdout-log=false
