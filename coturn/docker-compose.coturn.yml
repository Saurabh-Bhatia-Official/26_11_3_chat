version: '3.8'

services:
  coturn:
    image: coturn/coturn:latest
    container_name: whisper-coturn
    restart: unless-stopped
    # Use host networking in production on Linux for maximum NAT & WebRTC media throughput:
    # network_mode: host
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    environment:
      - COTURN_REALM=${COTURN_REALM:-whisper.chat}
      - COTURN_SECRET=${COTURN_SECRET:-whisper_turn_secret_secure_key_2026}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${COTURN_SECRET:-whisper_turn_secret_secure_key_2026}"
      - "--realm=${COTURN_REALM:-whisper.chat}"
