version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatgen-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SUPABASE_DB_URL=jdbc:postgresql://postgres:5432/chatdb
      - SUPABASE_DB_USER=postgres
      - SUPABASE_DB_PASSWORD=postgres_secure_pass
      - DB_DRIVER=org.postgresql.Driver
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-demo}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-demo_key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-demo_secret}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: chatgen-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chatdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
