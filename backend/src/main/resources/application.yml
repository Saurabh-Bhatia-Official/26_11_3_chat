server:
  port: ${PORT:8080}

spring:
  application:
    name: chat-backend
  datasource:
    # Connects to Supabase PostgreSQL if provided, or falls back to in-memory H2
    url: ${SUPABASE_DB_URL:jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SUPABASE_DB_USER:sa}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo_key}
  api-secret: ${CLOUDINARY_API_SECRET:demo_secret}

app:
  jwt:
    secret: ${JWT_SECRET:NextGenChatSuperSecretKey2026SecureTokenGeneratorForProductionDeployment98765}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5000,https://*.vercel.app,*}
